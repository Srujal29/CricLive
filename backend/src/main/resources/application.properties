spring.application.name=CricketScoreBackend
server.port=8080

# Database Configuration (MySQL / MariaDB)
spring.datasource.url=jdbc:mysql://localhost:3306/cricket_score_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# External Cricket API Configuration (CricketData.org / CricAPI)
cricket.api.base-url=https://api.cricapi.com/v1
cricket.api.key=233d2684-2671-4ec2-8396-804e1d000b4e
cricket.api.refresh-interval-seconds=45

# Logging
logging.level.com.cricket=INFO
